syntax = "proto3";

option go_package = "github.com/idiotcoffee/gRPC-learning/routing-example/router";

package router;

service RouteGuide {
    rpc GetFeature(Point) returns (Feature) {}; // unary streaming
    rpc ListFeatures(Rectangle) returns (stream Feature) {}; // server streaming
    rpc RecordRoute(stream Point) returns (RouteSummary) {}; // client streaming
    rpc RouteChat (stream RouteNote) returns (stream RouteNote); //bi-directional streaming
}

message Point{
    int32 latitude = 1;
    int32 longitude = 2;
}

message Rectangle {
    Point lo = 1;
    Point hi = 2;
}

message Feature {
    string name = 1;
    Point location = 2;
}

message RouteNote {
    Point location = 1;
    string message = 2;
}

message RouteSummary {
    int32 point_count = 1;
    int32 feature_count = 2;
    int32 distance = 3;
    int32 elapsed_time = 4;
}
